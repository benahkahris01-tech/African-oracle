name: Build static company pages

on:
  schedule:
    # 03:30 UTC = 06:30 East Africa Time. Make sure this is AFTER your Apps Script
    # daily run has pushed fresh data to Supabase; move it if your push runs later.
    - cron: "30 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate pages from Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SITE_URL: https://africanoracle.info
        run: node tools/build-static-pages.js

      - name: Commit changes (if any)
        run: |
          git config user.name  "oracle-bot"
          git config user.email "oracle-bot@users.noreply.github.com"
          git add stocks companies.html sitemap-stocks.xml
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Rebuild static company pages"
            git push
          fi